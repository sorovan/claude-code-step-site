<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude CodeのSTEP</title>
  <meta name="description" content="Claude Codeの初回操作から、AIへの指示の書き方、作業ファイルの守り方、GitHubの入口までを学べる無料教材です。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23c2410c'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/style.css">
  <script>
    /* テーマ：保存済みの選択を描画前に適用する（auto＝端末設定に合わせる。保存不可でも動く） */
    (function () {
      var key = "claude-code-step:theme:v1";
      var fontKey = "claude-code-step:font-size:v1";
      var mode = "auto";
      var fontSize = "medium";
      try { var s = window.localStorage.getItem(key); if (s === "light" || s === "dark") mode = s; } catch (e) {}
      try { var f = window.localStorage.getItem(fontKey); if (f === "small" || f === "large") fontSize = f; } catch (e) {}
      if (mode !== "auto") document.documentElement.setAttribute("data-theme", mode);
      document.documentElement.setAttribute("data-font-size", fontSize);
      document.addEventListener("DOMContentLoaded", function () {
        var sel = document.getElementById("theme-select");
        var fontSel = document.getElementById("font-size-select");
        if (sel) {
          sel.value = mode;
          sel.addEventListener("change", function () {
          var v = sel.value;
          if (v === "light" || v === "dark") {
            document.documentElement.setAttribute("data-theme", v);
          } else {
            document.documentElement.removeAttribute("data-theme");
          }
          try { window.localStorage.setItem(key, v); } catch (e) {}
          });
        }
        if (fontSel) {
          fontSel.value = fontSize;
          fontSel.addEventListener("change", function () {
            var v = fontSel.value === "small" || fontSel.value === "large" ? fontSel.value : "medium";
            document.documentElement.setAttribute("data-font-size", v);
            try { window.localStorage.setItem(fontKey, v); } catch (e) {}
          });
        }
      });
    })();
  </script>
</head>
<body>
  <a class="skip" href="#app" data-skip="main">本文へ移動</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="#/" data-nav="home">Claude CodeのSTEP</a>
      <nav class="main-nav" aria-label="主要メニュー">
        <a href="#/start" data-nav="start">最初の15分</a>
        <a href="#/steps" data-nav="steps">STEP一覧</a>
        <a href="#/chapters" data-nav="chapters">16章で学ぶ</a>
        <a href="#/search" data-nav="search">検索</a>
        <a href="#/final" data-nav="final">最終チェック</a>
      </nav>
      <div class="display-controls" aria-label="表示設定">
        <label class="theme-switch">テーマ
          <select id="theme-select">
            <option value="auto">端末設定に合わせる</option>
            <option value="light">ライト</option>
            <option value="dark">ダーク</option>
          </select>
        </label>
        <label class="theme-switch">文字サイズ
          <select id="font-size-select">
            <option value="small">小</option>
            <option value="medium">中</option>
            <option value="large">大</option>
          </select>
        </label>
      </div>
    </div>
  </header>

  <div class="wrap">
    <p id="store-notice" class="store-notice" hidden>この環境では進捗を保存できません。教材の閲覧と操作はそのまま行えます。</p>
    <p id="status" class="sr-status" role="status" aria-live="polite"></p>
    <main id="app" tabindex="-1">
      <p class="loading">読み込み中…</p>
    </main>
  </div>

  <footer class="site-footer">
    <div class="wrap">
      <a href="privacy.html">プライバシーポリシー</a>
    </div>
  </footer>

  <script src="assets/analytics.js" defer></script>
  <script src="assets/app.js" defer></script>
</body>
</html>
