<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude CodeのSTEP</title>
  <meta name="description" content="Claude Codeの初回操作から、AIへの指示の書き方、作業ファイルの守り方、GitHubの入口までを学べる無料教材です。">
  <link rel="stylesheet" href="assets/style.css">
  <script>
    /* テーマ：保存済みの選択を描画前に適用する（auto＝端末設定に合わせる。保存不可でも動く） */
    (function () {
      var key = "claude-code-step:theme:v1";
      var mode = "auto";
      try { var s = window.localStorage.getItem(key); if (s === "light" || s === "dark") mode = s; } catch (e) {}
      if (mode !== "auto") document.documentElement.setAttribute("data-theme", mode);
      document.addEventListener("DOMContentLoaded", function () {
        var sel = document.getElementById("theme-select");
        if (!sel) return;
        sel.value = mode;
        sel.addEventListener("change", function () {
          var v = sel.value;
          if (v === "light" || v === "dark") {
            document.documentElement.setAttribute("data-theme", v);
          } else {
            document.documentElement.removeAttribute("data-theme");
          }
          try { window.localStorage.setItem(key, v); } catch (e) {}
        });
      });
    })();
  </script>
</head>
<body>
  <a class="skip" href="#app" data-skip="main">本文へ移動</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="#/" data-nav="home">Claude CodeのSTEP</a>
      <nav class="main-nav" aria-label="主要メニュー">
        <a href="#/steps" data-nav="steps">STEP一覧</a>
        <a href="#/search" data-nav="search">検索</a>
        <a href="#/final" data-nav="final">最終チェック</a>
      </nav>
      <label class="theme-switch">表示
        <select id="theme-select">
          <option value="auto">端末設定に合わせる</option>
          <option value="light">ライト</option>
          <option value="dark">ダーク</option>
        </select>
      </label>
    </div>
  </header>

  <div class="wrap">
    <p id="store-notice" class="store-notice" hidden>この環境では進捗を保存できません。教材の閲覧と操作はそのまま行えます。</p>
    <p id="status" class="sr-status" role="status" aria-live="polite"></p>
    <main id="app" tabindex="-1">
      <p class="loading">読み込み中…</p>
    </main>
  </div>

  <footer class="site-footer">
    <div class="wrap">
      <p>教材の内容は学習目的です。AIの出力・成果・料金・公式情報を保証するものではありません。公式情報は変わるため、リンク先で最新版を確認してください。</p>
      <p>個人情報は収集しません。ログイン・決済・外部分析は使っていません。</p>
    </div>
  </footer>

  <script src="assets/app.js" defer></script>
</body>
</html>
